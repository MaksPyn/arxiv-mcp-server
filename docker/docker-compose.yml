# MCP servers talk over stdio, so they are normally launched by the MCP client
# (see README) rather than run as a long-lived service. This file is mainly a
# convenient way to build the image:  docker compose -f docker/docker-compose.yml build
services:
  arxiv-mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: arxiv-mcp-server
    stdin_open: true
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - arxiv-data:/data

volumes:
  arxiv-data:
